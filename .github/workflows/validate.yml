name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - if: always()
        run: |
          echo "### Logic tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 unittest.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: node --check custom_components/emsesp_pv_surplus/frontend/emsesp-pv-surplus-card.js

  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - name: Integration tests (real Home Assistant)
        run: |
          set -o pipefail
          python -m pytest -v -rA 2>&1 | tee pytest.log
      - name: Summary
        if: always()
        run: |
          echo "### Home Assistant integration tests" >> "$GITHUB_STEP_SUMMARY"
          python -c "import importlib.metadata as m; print('Home Assistant', m.version('homeassistant'))" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(PASSED|FAILED|ERROR)|passed|failed" pytest.log | tail -n 30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
